services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - backend/.env
    environment:
      # 容器内通过服务名访问，覆盖 .env 里的 localhost
      DATABASE_URL: postgresql+asyncpg://codepilot:codepilot@postgres:5432/codepilot
      REDIS_URL: redis://redis:6379/0
      # Celery 也必须改成服务名：.env 里是 localhost:6379 且带密码 3375，
      # 容器内 localhost 指向容器自身，不覆盖就连不上。
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHROMA_COLLECTION: codepilot_knowledge
    volumes:
      # 与 app/rag/retriever.py 中的路径保持一致：
      # backend/app/rag/retriever.py 上溯三层 → /app/chroma_data
      - chroma_data:/app/chroma_data
      - hf_cache:/root/.cache/huggingface
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 前端开发服务器（Vite HMR）。生产镜像已内置构建产物，无需此服务。
  frontend:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    profiles: ["dev"]   # 仅在 docker compose --profile dev up 时启动

  postgres:
    # pgvector 官方镜像：基于 PostgreSQL 16，自带 vector 扩展
    # （原 postgres:16-alpine 需额外编译安装扩展，镜像不支持）
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codepilot
      POSTGRES_PASSWORD: codepilot
      POSTGRES_DB: codepilot
    # 刻意不发布到宿主：宿主 5432 被原生 PostgreSQL 18 服务占用（它还在服务
    # gateway/harbordesk 等其他项目）。backend 走 compose 网络用服务名 postgres
    # 访问，本就不需要宿主端口；强行发布只会静默失败。
    # 若需要从宿主用 GUI 客户端连容器库，改成 "5433:5432"。
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepilot"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 同上：宿主 6379 被原生 Redis 占用，backend 用服务名访问即可。
    # 需要宿主访问时可改为 "6380:6379"。
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  chroma_data:
  hf_cache:
  uploads:
  node_modules:
